<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lagerbau-Simulator</title>
  </head>
  <body>
    <header class="kopf">
      <h1>Lagerbau-Simulator</h1>
      <nav class="nur-editor">
        <button id="btn-beispiel">Beispiel laden</button>
        <button id="btn-rueck" title="Strg+Z">Rückgängig</button>
        <button id="btn-wieder" title="Strg+Y">Wiederholen</button>
        <button id="btn-teilen">Link kopieren</button>
        <button id="btn-speichern">Speichern</button>
        <label class="datei">Laden<input id="inp-laden" type="file" accept="application/json,.json" hidden /></label>
      </nav>
      <button id="btn-bearbeiten" class="nur-ansicht">Bearbeiten</button>
    </header>
    <aside class="links nur-editor">
      <h2>Bauteile</h2>
      <button data-werkzeug="auswahl">Auswählen</button>
      <button data-werkzeug="dreibein">Dreibein setzen</button>
      <button data-werkzeug="abock">A-Bock setzen</button>
      <button data-werkzeug="stange">Stange ziehen</button>
      <button data-werkzeug="seil">Seil spannen</button>
      <button data-werkzeug="plane">Plane spannen</button>
      <button data-werkzeug="baum">Baum setzen</button>
      <div class="werkzeug-zeile">
        <button data-werkzeug="platzobjekt">Platz-Objekt setzen</button>
        <select id="sel-vorlage" aria-label="Vorlage für Platz-Objekte"></select>
      </div>
      <div class="werkzeug-zeile">
        <button data-werkzeug="zelt">Zelt setzen</button>
        <select id="sel-zelt" aria-label="Vorlage für Zelte"></select>
      </div>
      <button data-werkzeug="beschriftung">Beschriftung setzen</button>
      <button data-werkzeug="zone">Zone zeichnen</button>
      <button data-werkzeug="linie">Linie zeichnen</button>
      <button data-werkzeug="messen">Messen</button>
      <label class="datei">Luftbild…<input id="inp-luftbild" type="file" accept="image/png,image/jpeg" hidden /></label>
      <button id="btn-luftbild" aria-pressed="true" hidden>Luftbild</button>
      <section id="luftbild" hidden></section>
      <section id="parameter"></section>
    </aside>
    <main id="ansicht">
      <div class="ansichtsleiste">
        <button id="btn-ansicht" aria-pressed="false" title="Taste P">Plan / 3D</button>
        <button id="btn-alles" title="Taste F">Alles zeigen</button>
        <button id="btn-beschriftungen" aria-pressed="true">Beschriftungen zeigen</button>
      </div>
    </main>
    <aside class="rechts">
      <h2>Hinweise</h2>
      <ul id="hinweise"></ul>
      <p id="ausgeschaltet"></p>
      <button id="btn-regeln" aria-expanded="false">Regeln…</button>
      <section id="regeln" hidden></section>
      <h2>Materialliste</h2>
      <table id="stangenliste"></table>
      <p id="platzbedarf"></p>
      <button id="btn-lagerliste">Materialliste…</button>
    </aside>
    <section id="lagerliste" hidden></section>
    <footer>Planungshilfe. Ersetzt nicht Sichtprüfung und Probebelastung durch Leiter.</footer>
    <p id="meldung" role="status"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
